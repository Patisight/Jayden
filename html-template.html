<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 
    防乱码最佳实践模板
    1. 确保文件保存为UTF-8无BOM格式
    2. charset声明必须在<head>的前1024字节内
    3. 使用lang属性指定页面语言
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>页面标题</title>
    
    <!-- 可选：添加HTTP头部指令 -->
    <meta http-equiv="Content-Language" content="zh-CN">
    
    <style>
        /* CSS样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'SimSun', sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <!-- 页面内容 -->
    <h1>中文标题测试</h1>
    <p>这是一个防乱码的HTML模板示例。</p>
    
    <script>
        // JavaScript代码
        console.log('中文字符测试');
    </script>
</body>
</html>
